name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Installa dipendenze
        run: npm ci

      - name: Test frontend
        run: npm run test -- --run

      - name: Build + release firmata
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenProxy & Decks ${{ github.ref_name }}"
          releaseBody: |
            Installer Windows (NSIS) + aggiornamento firmato.

            L'app controlla da sola le release e propone l'aggiornamento
            (Impostazioni → Aggiornamenti, o la striscia in alto all'avvio).
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
